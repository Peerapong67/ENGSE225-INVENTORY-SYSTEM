name: Tests

# รันอัตโนมัติทุกครั้งที่ push หรือเปิด/อัปเดต Pull Request เข้า branch main/develop
# ตาม Merge & Release Policy ใน definition_of_done.md ข้อ 3
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

  # กดรันเองได้จากแท็บ Actions บน GitHub เผื่อไม่มี push/PR ใหม่แต่อยากเช็คซ้ำ
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

  # สแกนคุณภาพโค้ด (Flake8) และช่องโหว่ความปลอดภัย (Bandit) แยกเป็นอีก job ให้รันคู่ขนานกับ pytest
  # เกณฑ์อ่านจาก .flake8 และ pyproject.toml ตามรายงาน reports/Code_Quality_And_Security_Scan_Report.md
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.4.1 "bandit[toml]==1.9.4"

      - name: Run Flake8
        run: python -m flake8 --statistics --count .

      - name: Run Bandit
        run: python -m bandit -c pyproject.toml -r .
