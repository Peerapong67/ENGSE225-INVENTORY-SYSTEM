# ตั้งค่า Bandit (Security Scan) — รันด้วย: python -m bandit -c pyproject.toml -r .
[tool.bandit]
exclude_dirs = [".git", "__pycache__", "reports", ".venv", "venv", "env", ".pytest_cache"]

# pytest ใช้ assert เป็นกลไกหลักในการตรวจผล จึงข้าม B101 (assert_used) เฉพาะไฟล์เทสต์
# โค้ดโปรแกรมจริงยังถูกตรวจ B101 ตามปกติ
[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/conftest.py"]
